# =============================================================================
#  Black OS - Phase 6: GRUB2 boot menu (BIOS eltorito + UEFI hybrid image)
#
#  Theme: pitch black menu surfaces, neon cyan text, crimson selection bar.
# =============================================================================

set default=0
set timeout=3

if loadfont unicode ; then
    set gfxmode=auto
    insmod vbe
    insmod gfxterm
    terminal_output gfxterm
fi

insmod all_video
insmod gzio

set menu_color_normal=black/cyan
set menu_color_highlight=black/magenta
set color_normal=black/cyan

menuentry "Black OS (normal)" {
    multiboot2 /boot/blackos.bin boot
}

menuentry "Black OS (recovery console, single shell)" {
    multiboot2 /boot/blackos.bin recovery
}

menuentry "Black OS (safe TTY, verbose)" {
    multiboot2 /boot/blackos.bin safe-tty verbose
}
